name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    name: Build & typecheck @tokyo3rdhq/magi-design-system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # This monorepo has per-package lockfiles (no root lockfile).
          # Point the cache lookup at the actual file.
          cache: npm
          cache-dependency-path: packages/design-system/package-lock.json
      - name: Install
        working-directory: packages/design-system
        run: npm ci
      - name: Typecheck
        working-directory: packages/design-system
        run: npm run typecheck
      - name: Build
        working-directory: packages/design-system
        run: npm run build
      - name: Verify dist contents
        working-directory: packages/design-system
        run: |
            test -f dist/index.js
            test -f dist/index.d.ts
            test -f dist/styles.css
            echo "dist size:"
            du -sh dist

  showroom:
    name: Build @tokyo3rdhq/showroom
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/showroom/package-lock.json
      - name: Install package
        working-directory: packages/design-system
        run: npm ci
      - name: Build package
        working-directory: packages/design-system
        run: npm run build
      - name: Install showroom
        working-directory: apps/showroom
        run: npm ci
      - name: Build showroom
        working-directory: apps/showroom
        run: npm run build